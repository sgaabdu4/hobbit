name: Checks
on:
  push:
    paths: ['server/**', 'package.json', '.nvmrc', '.github/workflows/checks.yml']
  pull_request:
    paths: ['server/**', 'package.json', '.nvmrc', '.github/workflows/checks.yml']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.12.0'
      - run: npm test
